# hr.stek.kr frontend (nginx) — SPA 서빙 + supabase kong same-origin 프록시
# 브라우저는 https://hr.stek.kr/{auth,rest,storage,realtime}/... 로 호출하고,
# nginx 가 Dokploy Traefik(dokploy-traefik) 경유로 kong(api.hr.stek.kr) 에 전달한다.
# → 자체서명 cross-origin fetch 차단 문제 해소(브라우저는 hr.stek.kr 만 신뢰하면 됨).

# 감사로그 RPC 폭주 방지(보안리뷰 P3): log_event 경로에만 rate limit.
map $request_uri $logevent_key {
  "~*/rest/v1/rpc/log_event"  $binary_remote_addr;
  default                     "";
}
limit_req_zone $logevent_key zone=logevent:10m rate=10r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 실 클라이언트 IP 복원: dokploy-traefik(도커 10.0.0.0/8) 뒤. 도커 대역만 신뢰, 클라 LAN은 미신뢰.
  set_real_ip_from 10.0.0.0/8;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # 보안 헤더 (보안 리뷰 P1-11)
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

  # Docker 내장 DNS (서비스명 런타임 해석)
  resolver 127.0.0.11 valid=30s ipv6=off;

  # supabase kong 프록시 — Traefik 경유(자체서명 무시, Host 로 라우팅)
  # 관리 경로는 프록시하지 않는다(auth/rest/storage/realtime 만).
  location ~ ^/(auth|rest|storage|realtime)/ {
    set $sb_upstream https://dokploy-traefik:443;
    proxy_pass $sb_upstream;
    proxy_set_header Host api.hr.stek.kr;
    proxy_ssl_server_name on;
    proxy_ssl_name api.hr.stek.kr;
    proxy_ssl_verify off;                 # 자체서명(내부망)
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Client-IP $remote_addr;   # real_ip 복원된 실클라 IP를 위·변조 불가 커스텀헤더로 전달(중간 홉이 표준 XFF 재작성해도 보존)
    limit_req zone=logevent burst=20 nodelay;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }

  # 정적 자산 캐시
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA 폴백
  location / {
    try_files $uri $uri/ /index.html;
  }
}
